<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Maze Arrows — App Icon</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
  html, body { margin: 0; padding: 0;
    background: #161514;
    font-family: 'Geist', -apple-system, system-ui, sans-serif;
    color: #E8E5DE;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  body {
    background:
      radial-gradient(80% 50% at 30% 0%, rgba(60,60,90,0.35) 0%, transparent 60%),
      radial-gradient(60% 60% at 80% 100%, rgba(80,40,80,0.3) 0%, transparent 60%),
      #15131A;
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>

<script type="text/babel">
// ─── Icon mark library — paths designed for 100×100 viewBox ───
// All shapes are single-stroke, centered, with arrow tips. Designed to read
// at 40px while feeling rich at 1024px.
const MARKS = {
  spiral: {
    name: 'Spiral',
    d: 'M 50 50 L 50 38 L 62 38 L 62 62 L 38 62 L 38 30 L 70 30 L 70 70 L 30 70 L 30 22 L 80 22 L 80 14',
    arrows: [{ x: 80, y: 14, dir: 'up' }],
  },
  coil: {
    name: 'Coil',
    d: 'M 50 78 L 50 50 L 28 50 L 28 78 L 72 78 L 72 28 L 28 28 L 28 42 M 28 28 L 80 28',
    arrows: [{ x: 80, y: 28, dir: 'right' }],
  },
  knot: {
    name: 'Knot',
    d: 'M 22 22 L 50 22 L 50 50 L 78 50 L 78 78 M 22 78 L 50 78 L 50 50 M 50 50 L 22 50 L 22 22',
    arrows: [{ x: 78, y: 78, dir: 'down' }],
  },
  // M letter as maze path
  emm: {
    name: 'M-maze',
    d: 'M 18 82 L 18 22 L 36 22 L 36 60 L 50 60 L 50 22 L 64 22 L 64 60 L 82 60 L 82 22',
    arrows: [{ x: 82, y: 22, dir: 'up' }],
  },
  cross: {
    name: 'Compass',
    d: 'M 50 80 L 50 50 L 20 50 M 50 50 L 80 50 M 50 50 L 50 20',
    arrows: [
      { x: 20, y: 50, dir: 'left' },
      { x: 80, y: 50, dir: 'right' },
      { x: 50, y: 20, dir: 'up' },
      { x: 50, y: 80, dir: 'down' },
    ],
  },
  infinity: {
    name: 'Loop',
    d: 'M 22 50 L 22 30 L 50 30 L 50 50 L 78 50 L 78 70 L 50 70 L 50 50 L 22 50',
    arrows: [{ x: 22, y: 50, dir: 'left' }],
  },
  heart: {
    name: 'Heart',
    d: 'M 50 82 L 22 56 L 22 36 L 36 28 L 50 42 L 64 28 L 78 36 L 78 56 L 50 82',
    arrows: [],
  },
  zigzag: {
    name: 'Zig',
    d: 'M 18 70 L 36 70 L 36 30 L 50 30 L 50 70 L 64 70 L 64 30 L 82 30',
    arrows: [{ x: 82, y: 30, dir: 'right' }],
  },
};

// ─── Background palettes ──────────────────────────────────────
const PALETTES = {
  aurora:    { name: 'Aurora',    bg: ['#FFE7C8', '#FFB28E'], ink: '#1A1B2E', accent: '#5B5BD6' },
  indigo:    { name: 'Indigo',    bg: ['#6E6BFF', '#3F2BBE'], ink: '#FFFFFF', accent: '#FFE08A' },
  neon:      { name: 'Neon',      bg: ['#1A0A3A', '#06061A'], ink: '#5AF0FF', accent: '#FF52E4' },
  petal:     { name: 'Petal',     bg: ['#FFC4D8', '#A48EE0'], ink: '#FFFFFF', accent: '#FFE08A' },
  sakura:    { name: 'Sakura',    bg: ['#F4D7D2', '#D88B85'], ink: '#1A1310', accent: '#BC4749' },
  atlas:     { name: 'Atlas',     bg: ['#E8C9A0', '#C6502E'], ink: '#0F3D4A', accent: '#FFF7E0' },
  nordic:    { name: 'Nordic',    bg: ['#DDE0D6', '#3D4A3C'], ink: '#F6F6F1', accent: '#B86A3B' },
  midnight:  { name: 'Midnight',  bg: ['#1F2540', '#0A0B14'], ink: '#FFE08A', accent: '#FF52E4' },
  sunset:    { name: 'Sunset',    bg: ['#FF6B8A', '#FFAC4F'], ink: '#2A0E1A', accent: '#FFF7E0' },
  ocean:     { name: 'Ocean',     bg: ['#7DD8E2', '#15788A'], ink: '#FFFFFF', accent: '#FFE08A' },
  forest:    { name: 'Forest',    bg: ['#82A582', '#2A4530'], ink: '#FFF6E0', accent: '#D4A52A' },
  paper:     { name: 'Paper',     bg: ['#FAF7F0', '#E8E1D2'], ink: '#1A1B2E', accent: '#C4153A' },
  ink:       { name: 'Ink',       bg: ['#2A2A36', '#0E0E16'], ink: '#F0EAE0', accent: '#D49328' },
};

// ─── Tweak defaults ───────────────────────────────────────────
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "mark": "emm",
  "palette": "neon",
  "bgStyle": "mesh",
  "inkStyle": "glow",
  "strokeWidth": 5,
  "cornerRadius": 22,
  "padding": 8,
  "glow": 6,
  "gloss": true,
  "vignette": true,
  "motif": "maze",
  "motifOpacity": 0.35,
  "shadow": false,
  "endCap": "arrow",
  "name": "Neon Loop"
}/*EDITMODE-END*/;

// ─── Arrow chevron ────────────────────────────────────────────
function ArrowTip({ x, y, dir, size, stroke, strokeWidth }) {
  const rot = { right: 0, down: 90, left: 180, up: 270 }[dir] ?? 0;
  return (
    <g transform={`translate(${x} ${y}) rotate(${rot})`}>
      <polyline
        points={`-${size},-${size} 0,0 -${size},${size}`}
        fill="none"
        stroke={stroke}
        strokeWidth={strokeWidth}
        strokeLinecap="round"
        strokeLinejoin="round"
      />
    </g>
  );
}

// ─── The icon ─────────────────────────────────────────────────
function AppIcon({ size = 1024, t }) {
  const r = size * (t.cornerRadius / 100);                    // corner radius
  const mark = MARKS[t.mark] ?? MARKS.spiral;
  const pal = PALETTES[t.palette] ?? PALETTES.aurora;
  const idPrefix = React.useId().replace(/:/g, '');           // unique IDs

  // Inner content area (padding)
  const pad = size * (t.padding / 100);
  const inner = size - pad * 2;

  // Stroke width in inner coordinates (100 = viewBox)
  const sw = t.strokeWidth;

  // Background style
  let bgStyle;
  if (t.bgStyle === 'solid')   bgStyle = { background: pal.bg[0] };
  if (t.bgStyle === 'linear')  bgStyle = { background: `linear-gradient(160deg, ${pal.bg[0]} 0%, ${pal.bg[1]} 100%)` };
  if (t.bgStyle === 'radial')  bgStyle = { background: `radial-gradient(120% 100% at 25% 15%, ${pal.bg[0]} 0%, ${pal.bg[1]} 90%)` };
  if (t.bgStyle === 'mesh')    bgStyle = { background: `
    radial-gradient(60% 50% at 20% 15%, ${pal.bg[0]} 0%, transparent 60%),
    radial-gradient(70% 60% at 85% 80%, ${pal.accent}55 0%, transparent 60%),
    linear-gradient(160deg, ${pal.bg[0]} 0%, ${pal.bg[1]} 100%)
  ` };

  // Stroke fill: gradient / glow / solid / accent
  const inkUrl = `url(#ink-${idPrefix})`;
  const useGradient = t.inkStyle === 'gradient' || t.inkStyle === 'glow';
  const strokePaint =
    t.inkStyle === 'accent' ? pal.accent :
    useGradient ? inkUrl : pal.ink;

  return (
    <div style={{
      width: size, height: size, borderRadius: r, position: 'relative', overflow: 'hidden',
      ...bgStyle,
      boxShadow: t.shadow
        ? `inset 0 ${size*0.004}px 0 rgba(255,255,255,0.25),
           inset 0 -${size*0.006}px ${size*0.012}px rgba(0,0,0,0.18),
           0 ${size*0.02}px ${size*0.05}px rgba(0,0,0,0.35),
           0 ${size*0.01}px ${size*0.02}px rgba(0,0,0,0.25)`
        : 'none',
    }}>
      {/* Background motif (faint pattern) */}
      {t.motif !== 'none' && (
        <div style={{ position: 'absolute', inset: 0, opacity: t.motifOpacity, pointerEvents: 'none' }}>
          {t.motif === 'dots' && (
            <div style={{
              width: '100%', height: '100%',
              backgroundImage: `radial-gradient(${pal.ink}aa 1px, transparent 1px)`,
              backgroundSize: `${size*0.04}px ${size*0.04}px`,
            }}/>
          )}
          {t.motif === 'grid' && (
            <div style={{
              width: '100%', height: '100%',
              backgroundImage: `linear-gradient(${pal.ink} 1px, transparent 1px), linear-gradient(90deg, ${pal.ink} 1px, transparent 1px)`,
              backgroundSize: `${size*0.06}px ${size*0.06}px`,
            }}/>
          )}
          {t.motif === 'rays' && (
            <svg width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="none">
              {Array.from({ length: 24 }).map((_, i) => {
                const a = (i / 24) * Math.PI * 2;
                return <line key={i} x1="50" y1="50"
                  x2={50 + Math.cos(a)*80} y2={50 + Math.sin(a)*80}
                  stroke={pal.ink} strokeWidth="0.4"/>;
              })}
            </svg>
          )}
          {t.motif === 'maze' && (
            <svg width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">
              <g stroke={pal.ink} strokeWidth="0.6" fill="none" strokeLinecap="round">
                <path d="M 10 20 L 30 20 L 30 40 L 50 40"/>
                <path d="M 60 10 L 60 30 L 80 30 L 80 60"/>
                <path d="M 10 60 L 25 60 L 25 80 L 50 80"/>
                <path d="M 70 70 L 90 70 L 90 90"/>
                <path d="M 40 60 L 40 75"/>
              </g>
            </svg>
          )}
        </div>
      )}

      {/* The mark */}
      <svg
        viewBox="0 0 100 100"
        width="100%" height="100%"
        style={{ position: 'absolute', inset: 0, padding: `${(pad/size)*100}%`, boxSizing: 'border-box' }}
        preserveAspectRatio="xMidYMid meet"
      >
        <defs>
          <linearGradient id={`ink-${idPrefix}`} x1="0" y1="0" x2="0" y2="1">
            {t.inkStyle === 'glow' ? (
              <>
                <stop offset="0" stopColor={pal.accent}/>
                <stop offset="1" stopColor={pal.ink}/>
              </>
            ) : t.inkStyle === 'gold' ? (
              <>
                <stop offset="0" stopColor="#FFF1B8"/>
                <stop offset="0.4" stopColor="#FFD86B"/>
                <stop offset="1" stopColor="#A0691A"/>
              </>
            ) : (
              <>
                <stop offset="0" stopColor={pal.ink}/>
                <stop offset="1" stopColor={pal.ink} stopOpacity="0.78"/>
              </>
            )}
          </linearGradient>

          <filter id={`glow-${idPrefix}`} x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation={t.glow * 0.5} result="b"/>
            <feMerge>
              <feMergeNode in="b"/>
              <feMergeNode in="b"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>

          <filter id={`drop-${idPrefix}`} x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="0.6"/>
            <feOffset dx="0" dy="0.8" result="o"/>
            <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
            <feMerge>
              <feMergeNode/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>

        <g filter={t.glow > 0 ? `url(#glow-${idPrefix})` : t.shadow ? `url(#drop-${idPrefix})` : undefined}>
          <path
            d={mark.d}
            fill="none"
            stroke={strokePaint}
            strokeWidth={sw}
            strokeLinecap="round"
            strokeLinejoin="round"
          />
          {/* Highlight overlay on the stroke top edge */}
          {t.gloss && t.inkStyle !== 'glow' && (
            <path
              d={mark.d}
              fill="none"
              stroke="#fff"
              strokeWidth={sw * 0.35}
              strokeLinecap="round"
              strokeLinejoin="round"
              opacity="0.32"
              style={{ mixBlendMode: 'overlay', transform: 'translateY(-0.4px)' }}
            />
          )}
          {/* Arrow tips */}
          {t.endCap !== 'none' && mark.arrows.map((a, i) => (
            <ArrowTip key={i} x={a.x} y={a.y} dir={a.dir} size={sw * 1.05}
              stroke={strokePaint} strokeWidth={sw * 0.95}/>
          ))}
          {/* Optional end dots */}
          {t.endCap === 'dot' && mark.arrows.map((a, i) => (
            <circle key={`d-${i}`} cx={a.x} cy={a.y} r={sw * 0.9} fill={strokePaint}/>
          ))}
        </g>
      </svg>

      {/* Top gloss highlight */}
      {t.gloss && (
        <div style={{
          position: 'absolute', inset: 0, borderRadius: r, pointerEvents: 'none',
          background: 'linear-gradient(180deg, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0) 45%)',
        }}/>
      )}
      {/* Bottom vignette */}
      {t.vignette && (
        <div style={{
          position: 'absolute', inset: 0, borderRadius: r, pointerEvents: 'none',
          background: 'radial-gradient(120% 80% at 50% 100%, rgba(0,0,0,0.18) 0%, transparent 60%)',
        }}/>
      )}
    </div>
  );
}

// ─── Size ladder ──────────────────────────────────────────────
function SizeLadder({ t }) {
  const sizes = [180, 120, 87, 60, 40, 29];
  return (
    <div style={{ display: 'flex', gap: 28, alignItems: 'flex-end', justifyContent: 'center' }}>
      {sizes.map(s => (
        <div key={s} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 8 }}>
          <AppIcon size={s} t={t}/>
          <div style={{ fontSize: 10, color: 'rgba(255,255,255,0.45)', fontWeight: 600,
            letterSpacing: 0.5, textTransform: 'uppercase', fontFamily: 'Geist' }}>{s}px</div>
        </div>
      ))}
    </div>
  );
}

// ─── Home-screen mock ─────────────────────────────────────────
function HomeScreenMock({ t }) {
  // Static iOS-ish home grid with our icon among placeholders
  const placeholders = [
    { c: '#FF453A', e: '📷' }, { c: '#34C759', e: '💬' }, { c: '#007AFF', e: '🗺' },
    { c: '#FFCC00', e: '✉' }, null, { c: '#AF52DE', e: '🎵' },
    { c: '#FF9F0A', e: '📁' }, { c: '#5856D6', e: '📅' }, { c: '#30B0C7', e: '🔍' },
    { c: '#FF2D55', e: '❤' }, { c: '#64D2FF', e: '☁' }, { c: '#BF5AF2', e: '🎮' },
  ];
  return (
    <div style={{
      width: 320, height: 690, borderRadius: 48, padding: 16,
      background: 'linear-gradient(180deg, #5E7BB8 0%, #3C4F8F 100%)',
      position: 'relative', overflow: 'hidden',
      boxShadow: '0 30px 60px rgba(0,0,0,0.5), 0 0 0 8px #1A1A1F',
    }}>
      {/* Status bar */}
      <div style={{ display: 'flex', justifyContent: 'space-between', padding: '8px 22px 18px',
        fontFamily: '-apple-system, SF Pro, system-ui', color: '#fff', fontWeight: 700, fontSize: 13 }}>
        <span>9:41</span>
        <span style={{ opacity: 0.95 }}>·   100%</span>
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 24, padding: '20px 16px' }}>
        {placeholders.slice(0, 4).map((p, i) => (
          <AppCell key={i} p={p}/>
        ))}
        <AppCellOurs t={t}/>
        {placeholders.slice(5, 12).map((p, i) => (
          <AppCell key={`b${i}`} p={p}/>
        ))}
      </div>
      {/* Dock */}
      <div style={{
        position: 'absolute', bottom: 24, left: 18, right: 18,
        background: 'rgba(255,255,255,0.18)', backdropFilter: 'blur(20px)',
        borderRadius: 28, padding: 14, display: 'flex', gap: 18, justifyContent: 'center',
      }}>
        {['📞', '🌐', '💌', '🎧'].map((e, i) => (
          <div key={i} style={{
            width: 52, height: 52, borderRadius: 12,
            background: 'rgba(255,255,255,0.85)', display: 'flex',
            alignItems: 'center', justifyContent: 'center', fontSize: 26,
          }}>{e}</div>
        ))}
      </div>
    </div>
  );
}

function AppCell({ p }) {
  if (!p) return <div/>;
  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4 }}>
      <div style={{ width: 56, height: 56, borderRadius: 13, background: p.c,
        display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 28,
        boxShadow: '0 2px 4px rgba(0,0,0,0.2)',
      }}>{p.e}</div>
      <div style={{ fontSize: 10, color: '#fff', fontFamily: '-apple-system, SF Pro' }}>—</div>
    </div>
  );
}
function AppCellOurs({ t }) {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4 }}>
      <AppIcon size={56} t={t}/>
      <div style={{ fontSize: 10, color: '#fff', fontFamily: '-apple-system, SF Pro', fontWeight: 600 }}>Maze Arrows</div>
    </div>
  );
}

// ─── Preset row ───────────────────────────────────────────────
const PRESETS = [
  { name: 'Aurora',     mark: 'spiral',   palette: 'aurora',    bgStyle: 'radial', inkStyle: 'gradient', strokeWidth: 11, glow: 0,  motif: 'dots' },
  { name: 'Indigo',     mark: 'knot',     palette: 'indigo',    bgStyle: 'radial', inkStyle: 'gradient', strokeWidth: 11, glow: 0,  motif: 'none' },
  { name: 'Neon Loop',  mark: 'infinity', palette: 'neon',      bgStyle: 'mesh',   inkStyle: 'glow',     strokeWidth: 9,  glow: 6,  motif: 'grid' },
  { name: 'Sakura M',   mark: 'emm',      palette: 'sakura',    bgStyle: 'radial', inkStyle: 'gradient', strokeWidth: 12, glow: 0,  motif: 'dots' },
  { name: 'Compass',    mark: 'cross',    palette: 'paper',     bgStyle: 'solid',  inkStyle: 'gradient', strokeWidth: 10, glow: 0,  motif: 'maze' },
  { name: 'Sunset',     mark: 'coil',     palette: 'sunset',    bgStyle: 'mesh',   inkStyle: 'gradient', strokeWidth: 11, glow: 0,  motif: 'dots' },
  { name: 'Gold Coil',  mark: 'spiral',   palette: 'ink',       bgStyle: 'radial', inkStyle: 'gold',     strokeWidth: 11, glow: 2,  motif: 'rays' },
  { name: 'Nordic Z',   mark: 'zigzag',   palette: 'nordic',    bgStyle: 'linear', inkStyle: 'gradient', strokeWidth: 10, glow: 0,  motif: 'none' },
];

function PresetCard({ p, current, onPick }) {
  // Build a full tweak object from preset, fill in remaining defaults
  const full = { ...TWEAK_DEFAULTS, ...p };
  const isCurrent = current.mark === p.mark && current.palette === p.palette;
  return (
    <div onClick={() => onPick(p)} style={{
      display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 8,
      padding: 10, borderRadius: 16, cursor: 'pointer',
      background: isCurrent ? 'rgba(255,255,255,0.08)' : 'transparent',
      border: isCurrent ? '1px solid rgba(255,255,255,0.18)' : '1px solid transparent',
      transition: 'all .15s',
    }}>
      <AppIcon size={88} t={full}/>
      <div style={{ fontSize: 11, color: 'rgba(255,255,255,0.7)', fontWeight: 600, fontFamily: 'Geist' }}>
        {p.name}
      </div>
    </div>
  );
}

// ─── App ──────────────────────────────────────────────────────
function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  const applyPreset = (p) => {
    setTweak({ ...p });
  };

  return (
    <div style={{ minHeight: '100vh', padding: '40px 32px 60px',
      display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 40 }}>
      {/* Header */}
      <div style={{ textAlign: 'center' }}>
        <div style={{ fontFamily: 'Geist', fontSize: 11, color: 'rgba(255,255,255,0.5)',
          textTransform: 'uppercase', letterSpacing: 1.6, fontWeight: 700 }}>App Icon Studio</div>
        <div style={{ fontFamily: 'Bricolage Grotesque', fontSize: 42, fontWeight: 800,
          letterSpacing: -1.2, marginTop: 6, color: '#F5F2EC' }}>Maze Arrows</div>
        <div style={{ fontFamily: 'Geist', fontSize: 14, color: 'rgba(255,255,255,0.55)', marginTop: 6 }}>
          Tap any preset · or open <b>Tweaks</b> for full control
        </div>
      </div>

      {/* Hero row: home screen + main icon */}
      <div style={{ display: 'flex', gap: 56, alignItems: 'center', flexWrap: 'wrap', justifyContent: 'center' }}>
        <HomeScreenMock t={t}/>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 18, alignItems: 'center' }}>
          <AppIcon size={420} t={t}/>
          <div style={{
            display: 'flex', alignItems: 'center', gap: 10,
            padding: '6px 14px', borderRadius: 999,
            background: 'rgba(255,255,255,0.08)',
            border: '1px solid rgba(255,255,255,0.12)',
          }}>
            <span style={{ fontSize: 11, fontWeight: 700, color: 'rgba(255,255,255,0.55)',
              textTransform: 'uppercase', letterSpacing: 1, fontFamily: 'Geist' }}>1024 × 1024</span>
            <span style={{ width: 1, height: 12, background: 'rgba(255,255,255,0.15)' }}/>
            <span style={{ fontSize: 11, fontWeight: 700, color: 'rgba(255,255,255,0.7)',
              fontFamily: 'Geist' }}>{MARKS[t.mark].name} · {PALETTES[t.palette].name}</span>
          </div>
        </div>
      </div>

      {/* Size ladder */}
      <div style={{ width: '100%', maxWidth: 880, padding: '28px 36px',
        background: 'rgba(255,255,255,0.04)', borderRadius: 24,
        border: '1px solid rgba(255,255,255,0.08)' }}>
        <div style={{ fontFamily: 'Geist', fontSize: 11, color: 'rgba(255,255,255,0.5)',
          textTransform: 'uppercase', letterSpacing: 1.2, fontWeight: 700, marginBottom: 22 }}>
          Scale ladder · iOS sizes
        </div>
        <SizeLadder t={t}/>
      </div>

      {/* Presets */}
      <div style={{ width: '100%', maxWidth: 880, padding: '24px 28px',
        background: 'rgba(255,255,255,0.04)', borderRadius: 24,
        border: '1px solid rgba(255,255,255,0.08)' }}>
        <div style={{ fontFamily: 'Geist', fontSize: 11, color: 'rgba(255,255,255,0.5)',
          textTransform: 'uppercase', letterSpacing: 1.2, fontWeight: 700, marginBottom: 14 }}>
          Presets · click to apply
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 4 }}>
          {PRESETS.map(p => <PresetCard key={p.name} p={p} current={t} onPick={applyPreset}/>)}
        </div>
      </div>

      <TweaksPanel>
        <TweakSection label="Mark"/>
        <TweakSelect label="Shape" value={t.mark}
          options={Object.keys(MARKS).map(k => ({ value: k, label: MARKS[k].name }))}
          onChange={(v) => setTweak('mark', v)}/>
        <TweakRadio label="End cap" value={t.endCap}
          options={['arrow', 'dot', 'none']}
          onChange={(v) => setTweak('endCap', v)}/>
        <TweakSlider label="Stroke" value={t.strokeWidth} min={4} max={20} step={0.5}
          onChange={(v) => setTweak('strokeWidth', v)}/>
        <TweakSlider label="Padding" value={t.padding} min={8} max={36}
          onChange={(v) => setTweak('padding', v)}/>

        <TweakSection label="Palette"/>
        <TweakSelect label="Theme" value={t.palette}
          options={Object.keys(PALETTES).map(k => ({ value: k, label: PALETTES[k].name }))}
          onChange={(v) => setTweak('palette', v)}/>
        <TweakRadio label="Background" value={t.bgStyle}
          options={['solid', 'linear', 'radial', 'mesh']}
          onChange={(v) => setTweak('bgStyle', v)}/>
        <TweakSelect label="Ink style" value={t.inkStyle}
          options={[
            {value:'gradient', label:'Gradient'},
            {value:'glow',     label:'Glow / neon'},
            {value:'gold',     label:'Gold'},
            {value:'accent',   label:'Accent'},
            {value:'solid',    label:'Solid'},
          ]}
          onChange={(v) => setTweak('inkStyle', v)}/>
        <TweakSlider label="Glow" value={t.glow} min={0} max={12} step={0.5}
          onChange={(v) => setTweak('glow', v)}/>

        <TweakSection label="Shape & finish"/>
        <TweakSlider label="Corner radius" value={t.cornerRadius} min={0} max={50} step={1} unit="%"
          onChange={(v) => setTweak('cornerRadius', v)}/>
        <TweakToggle label="Top gloss" value={t.gloss}
          onChange={(v) => setTweak('gloss', v)}/>
        <TweakToggle label="Bottom vignette" value={t.vignette}
          onChange={(v) => setTweak('vignette', v)}/>
        <TweakToggle label="Outer shadow" value={t.shadow}
          onChange={(v) => setTweak('shadow', v)}/>

        <TweakSection label="Background motif"/>
        <TweakRadio label="Pattern" value={t.motif}
          options={['none', 'dots', 'grid', 'rays', 'maze']}
          onChange={(v) => setTweak('motif', v)}/>
        <TweakSlider label="Pattern opacity" value={t.motifOpacity} min={0} max={0.35} step={0.01}
          onChange={(v) => setTweak('motifOpacity', v)}/>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
